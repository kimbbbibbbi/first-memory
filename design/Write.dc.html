<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>기억 쓰기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#3F5D4A}a:hover{color:#2D4636}
textarea::placeholder{color:#6F685A}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #FAF6EC; overflow: hidden; font-family: 'Gowun Dodum', sans-serif; color: #2B2A26; display: flex; flex-direction: column">

  <div style="height: 64px; padding: 12px 8px 0 8px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between">
    <a href="Journey.dc.html" aria-label="뒤로" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2B2A26" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <span style="font-family: 'Gowun Batang', serif; font-size: 18px; font-weight: 700">기억 쓰기</span>
    <span style="width: 48px"></span>
  </div>

  <div style="padding: 8px 24px 0; display: flex; flex-direction: column; gap: 14px">

    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="40" height="40" viewBox="0 0 80 80" aria-hidden="true">
        <path d="M40 18 C40 8 30 5 23 9 C25 17 33 20 40 18Z" fill="#5E8A6A"/>
        <path d="M40 18 C40 8 50 5 57 9 C55 17 47 20 40 18Z" fill="#4A7557"/>
        <path d="M40 18 L40 28" stroke="#4A7557" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <ellipse cx="40" cy="52" rx="22" ry="25" fill="#E8CFA4"/>
        <circle cx="32" cy="50" r="2.6" fill="#2B2A26"/>
        <circle cx="48" cy="50" r="2.6" fill="#2B2A26"/>
        <path d="M35 58 Q40 63 45 58" stroke="#2B2A26" stroke-width="2" stroke-linecap="round" fill="none"/>
      </svg>
      <span style="font-size: 13px; color: #6F685A">출발 질문</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <p style="margin: 0; font-family: 'Gowun Batang', serif; font-size: 24px; line-height: 1.5; font-weight: 700">당신의 가장 첫 기억은<br>무엇인가요?</p>
      <p style="margin: 0; font-size: 15px; color: #6F685A">어렴풋해도 괜찮아요. 한 장면이면 충분해요.</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; color: #6F685A">그때 나이</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{ ages }}" as="item" hint-placeholder-count="5">
          <button type="button" onClick="{{ item.pick }}" style="height: 36px; padding: 0 14px; border-radius: 18px; font-family: 'Gowun Dodum', sans-serif; font-size: 14px; background: {{ item.bg }}; color: {{ item.fg }}; border: 1px solid {{ item.bd }}">{{ item.label }}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="memory-body" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">기억 내용</label>
      <textarea id="memory-body" rows="6" maxLength="500" value="{{ text }}" onChange="{{ onText }}" placeholder="그때 보이던 것, 들리던 소리, 함께 있던 사람을 떠올려 보세요." style="width: 100%; height: 192px; box-sizing: border-box; padding: 0 4px; border: 0; outline: none; resize: none; background-color: transparent; background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 31px, #E4DCC8 31px, #E4DCC8 32px); background-attachment: local; font-family: 'Gowun Batang', serif; font-size: 17px; line-height: 32px; color: #2B2A26"></textarea>
      <div style="text-align: right; font-size: 13px; color: #6F685A">{{ countLabel }}</div>
    </div>

    <button type="button" style="height: 48px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; background: transparent; border: 1.5px dashed #B9A67E; border-radius: 14px; font-family: 'Gowun Dodum', sans-serif; font-size: 15px; color: #6B5320">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B5320" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="1.5"/><path d="M21 16l-5-5-8 8"/></svg>
      <span>그때의 사진 추가 (선택)</span>
    </button>
  </div>

  <div style="margin-top: auto; padding: 0 24px 16px; display: flex; flex-direction: column; align-items: stretch">
    <a href="Deepen.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; background: #3F5D4A; color: #FFFFFF; border-radius: 16px; font-size: 17px; text-decoration: none">저장하고 더 떠올려 보기</a>
    <a href="Write.dc.html" style="height: 48px; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #3F5D4A; text-decoration: underline">질문 없이 자유롭게 쓰기</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const age = st.age ?? 1;
    const text = st.text ?? '';
    const labels = ['3살 이전', '3~4살', '5~6살', '7살 이후', '모르겠어요'];
    return {
      ages: labels.map((label, i) => ({
        label,
        pick: () => this.setState({ age: i }),
        bg: i === age ? '#3F5D4A' : '#FFFFFF',
        fg: i === age ? '#FFFFFF' : '#2B2A26',
        bd: i === age ? '#3F5D4A' : '#D9CFB8'
      })),
      text,
      onText: (e) => this.setState({ text: e.target.value }),
      countLabel: `${text.length} / 500`
    };
  }
}
</script>
</body>
</html>
